name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches:
      - main

# Allow this job to clone the repo and commit to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies 🔧
        run: |
          cd frontend
          npm ci

      - name: Build React App 🏗️
        env:
          # Set your production backend HTTPS URL here (e.g. https://your-backend.onrender.com)
          VITE_API_BASE_URL: ""
        run: |
          cd frontend
          npm run build
          # Hack to make React Router client-side routing work on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
